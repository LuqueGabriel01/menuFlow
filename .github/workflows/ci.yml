name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menuflow_test
          MYSQL_USER: menuflow
          MYSQL_PASSWORD: menuflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
        env:
          SERVER_PORT: 8080
          SPRING_PROFILES_ACTIVE: test
          MENU_FLOW_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/menuflow_test
          MENU_FLOW_DATASOURCE_USERNAME: menuflow
          MENU_FLOW_DATASOURCE_PASSWORD: menuflow
          MENU_FLOW_JPA_DDL: update
          MENU_FLOW_JWT_SECRET: ci-only-secret-never-used-in-production-0123456789
          MENU_FLOW_FRONTEND_URL: http://localhost:5173

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t menuflow:ci .
