services:
  db:
    image: mysql:8.0
    container_name: menuflow-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - menuflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menuflow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MENU_FLOW_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      MENU_FLOW_DATASOURCE_USERNAME: ${MYSQL_USER}
      MENU_FLOW_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      MENU_FLOW_JPA_DDL: ${MENU_FLOW_JPA_DDL:-validate}
      MENU_FLOW_JPA_SHOW_SQL: ${MENU_FLOW_JPA_SHOW_SQL:-false}
      MENU_FLOW_LOG_LEVEL_ROOT: ${MENU_FLOW_LOG_LEVEL_ROOT:-INFO}
      MENU_FLOW_LOG_LEVEL_SPRING: ${MENU_FLOW_LOG_LEVEL_SPRING:-WARN}
      MENU_FLOW_JWT_SECRET: ${MENU_FLOW_JWT_SECRET}
      MENU_FLOW_JWT_EXPIRATION: ${MENU_FLOW_JWT_EXPIRATION:-1800000}
      MENU_FLOW_FRONTEND_URL: ${MENU_FLOW_FRONTEND_URL:-http://localhost:4200}
      MENU_FLOW_QR_SIZE: ${MENU_FLOW_QR_SIZE:-300}
      SWAGGER_UI_DOCUMENTATION_ENABLED: ${SWAGGER_UI_DOCUMENTATION_ENABLED:-true}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"

volumes:
  menuflow_mysql_data:
