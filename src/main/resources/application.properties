# Application Configuration
spring.application.name=menu-flow-service
server.port=${SERVER_PORT}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Importación de variables externas (El archivo .env que usa tu equipo)
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Ahora usa variables de entorno)
spring.datasource.url=${MENU_FLOW_DATASOURCE_URL}
spring.datasource.username=${MENU_FLOW_DATASOURCE_USERNAME}
spring.datasource.password=${MENU_FLOW_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Cambiamos 'update' por una variable que por defecto sea 'validate' para seguridad
spring.jpa.hibernate.ddl-auto=${MENU_FLOW_JPA_DDL:validate}
spring.jpa.show-sql=${MENU_FLOW_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Logging Configuration (Estilo equipo nuevo)
logging.level.org.springframework=${MENU_FLOW_LOG_LEVEL_SPRING:WARN}
logging.level.root=${MENU_FLOW_LOG_LEVEL_ROOT:INFO}

# Jwt Configurations (Unificado con el prefijo 'app')
app.jwt.secret=${MENU_FLOW_JWT_SECRET}
app.jwt.expiration=${MENU_FLOW_JWT_EXPIRATION:1800000}
app.jwt.token-type=Bearer

# Business Logic Configuration
app.frontend.url=${MENU_FLOW_FRONTEND_URL}
app.qr.default-size=${MENU_FLOW_QR_SIZE:300}

# Actuator (Para monitoreo básico)
management.endpoints.web.exposure.include=health

# Documentation Configuration (Swagger/OpenAPI)
springdoc.api-docs.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_UI_DOCUMENTATION_ENABLED:false}
springdoc.api-docs.version=OPENAPI_3_1

#Trace of SpringSecurity
logging.level.org.springframework.security = trace


